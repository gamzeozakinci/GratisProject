# Environment
base.url=https://www.gratis.com/
api.base.url=https://www.gratis.com/api

# Browser: chromium | firefox | webkit
browser=chromium
headless=true
slow.mo=0
default.timeout=15000

# Viewport widths used by TC_006 (desktop) / TC_007 (mobile) to switch layouts
desktop.viewport.width=1440
desktop.viewport.height=900
mobile.viewport.width=390
mobile.viewport.height=844

# Screenshots on failure
screenshot.on.failure=true
screenshot.dir=test-output/screenshots

# Known-state test accounts (see README "Test Data & Environment Assumptions")
existing.user.email=registered_qa@gratis.com
active.user.email=active_user@gratis.com
active.user.password=Password123!
forgot.password.email=forgotten_pass@gratis.com

# Promo codes
valid.promo.code=YAZ20
invalid.promo.code=INVALIDCODE
expired.promo.code=WINTER50

# Mock OTP used across TC_001 and TC_028
mock.otp=123456
